# Paths are relative to this file. Inputs must be trusted torch.save files.
[data]
ratings_path = "../data/user_ratings.pt"
movies_path = "../data/movies.pt"
test_ratio = 0.1
val_ratio = 0.1
num_id_buckets = 10000
num_actor_buckets = 10000
num_genre_buckets = 1000
num_director_buckets = 5000

[model]
feature_size = 32
model_embed_dim = 128
num_attention_heads = 8
num_movie_attention_blocks = 1
num_self_attention_blocks = 2
num_cross_attention_blocks = 2
use_feature_type_embeddings = true

[training]
epochs = 20
steps_per_epoch = 400
validation_steps = 50
test_steps = 50
batch_size = 32
min_context_size = 8
max_context_size = 64
min_target_size = 2
max_target_size = 8
learning_rate = 0.0003
weight_decay = 0.01
ranking_weight = 1.0
mse_weight = 0.25
ranking_margin = 0.1
# Use "huber" for 2 * Huber on rating differences, including tied targets.
# ranking_weight scales either objective; the metric remains named "ranking".
ranking_loss = "margin"
ranking_huber_delta = 0.1 # Difference-error threshold, used only for "huber".
max_grad_norm = 1.0
max_batch_attempts = 20
seed = 42
progress = true

[runtime]
device = "auto"
# Logs always appear in the terminal. Uncomment to also retain them in a file.
# log_path = "../runs/default/train.log"
# Checkpoints are disabled unless a directory is explicitly configured.
# checkpoint_dir = "../runs/default/checkpoints"
# resume_path = "../runs/default/checkpoints/last.pt"
# Set positive to retain snapshots in addition to best.pt and last.pt.
save_every = 0
