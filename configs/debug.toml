# Paths are relative to this file. Inputs must be trusted torch.save files.
[data]
ratings_path = "/content/drive/MyDrive/LettMePickData/2026-batch/users-ratings-dict.pt"
movies_path = "/content/drive/MyDrive/LettMePickData/2026-batch/movies-data-dict_complete.pt"
test_ratio = 0.1
val_ratio = 0.05
num_id_buckets = 45000
num_actor_buckets = 55000
num_director_buckets = 17000
num_genre_buckets = 20

[model]
feature_size = 12
model_embed_dim = 12
num_attention_heads = 1
num_movie_attention_blocks = 1
num_self_attention_blocks = 1
num_cross_attention_blocks = 1
use_feature_type_embeddings = true

[training]
epochs = 2
steps_per_epoch = 10
validation_steps = 20
test_steps = 50
batch_size = 4
min_context_size = 2
max_context_size = 64
min_target_size = 4
max_target_size = 64
learning_rate = 0.0001
weight_decay = 0.001
ranking_weight = 1.0
mse_weight = 0.25
ranking_margin = 0.005
max_batch_attempts = 5
seed = 42
progress = false

[runtime]
# Logs always appear in the terminal. Uncomment to also retain them in a file.
# log_path = "../runs/default/train.log"
# Checkpoints are disabled unless a directory is explicitly configured.
# checkpoint_dir = "../runs/default/checkpoints"
device = "auto"
save_every = 0
